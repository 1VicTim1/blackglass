[package]
name = "nulltrace"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
infer = "0.19"
ipnet = "2"
idna = "1"
kamadak-exif = "0.6"
mailparse = "0.16"
maxminddb = "0.26"
psl = "2"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
webpki-roots = "1"
x509-parser = "0.18"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "nulltrace"
path = "src/main.rs"
